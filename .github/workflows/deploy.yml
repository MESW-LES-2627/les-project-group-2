name: Deploy em Vercel 

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJ_ID }}

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Validate migrations against a clean disposable database
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase db reset --no-seed
          supabase test db
          supabase db query --read-only --file scripts/database-schema.sql > "$RUNNER_TEMP/database-schema.json"

      - name: Save the clean schema baseline
        uses: actions/upload-artifact@v4
        with:
          name: database-schema
          path: ${{ runner.temp }}/database-schema.json
          if-no-files-found: error

      - name: Stop the disposable database
        if: always()
        run: supabase stop --no-backup


  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Download the clean schema baseline
        uses: actions/download-artifact@v4
        with:
          name: database-schema
          path: ${{ runner.temp }}

      # Staging migrations (staging branch)
      - name: Run Migrations (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_URL_STAGING }}" ]; then
            DB_TARGET="${{ secrets.SUPABASE_DB_URL_STAGING }}"
            supabase db push --yes --include-all --remote="$DB_TARGET"
          elif [ -n "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}" ]; then
            DB_TARGET="${{ secrets.SUPABASE_STAGING_PROJECT_ID }}"
            supabase db push --yes --include-all --remote="$DB_TARGET" --password="${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}"
          else
            DB_TARGET="${{ secrets.SUPABASE_STAGING_PROJECT_ID }}"
            supabase db push --yes --include-all --remote="$DB_TARGET"
          fi
          node scripts/check-database-schema.mjs --expected "$RUNNER_TEMP/database-schema.json" --remote "$DB_TARGET"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Production migrations (main branch)
      - name: Run Migrations (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_URL_PRODUCTION }}" ]; then
            DB_TARGET="${{ secrets.SUPABASE_DB_URL_PRODUCTION }}"
            supabase db push --yes --include-all --remote="$DB_TARGET"
          elif [ -n "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" ]; then
            DB_TARGET="${{ secrets.SUPABASE_PROD_PROJECT_ID }}"
            supabase db push --yes --include-all --remote="$DB_TARGET" --password="${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
          else
            DB_TARGET="${{ secrets.SUPABASE_PROD_PROJECT_ID }}"
            supabase db push --yes --include-all --remote="$DB_TARGET"
          fi
          node scripts/check-database-schema.mjs --expected "$RUNNER_TEMP/database-schema.json" --remote "$DB_TARGET"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}


  deploy: 
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Destroy repo reference 
        run: rm -rf .git 

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm i -g vercel

      # Production deployment (main branch)
      - name: Pull Vercel environment (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Staging deployment (staging branch)
      - name: Pull Vercel environment (Staging)
        if: github.ref == 'refs/heads/staging'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Configure Staging Database Environment
        if: github.ref == 'refs/heads/staging'
        run: |
          if [ -n "${{ secrets.SUPABASE_STAGING_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_STAGING_URL }}" >> .vercel/.env.preview.local
          fi
          if [ -n "${{ secrets.SUPABASE_STAGING_ANON_KEY }}" ]; then
            echo "SUPABASE_KEY=${{ secrets.SUPABASE_STAGING_ANON_KEY }}" >> .vercel/.env.preview.local
          fi

      - name: Build (Staging)
        if: github.ref == 'refs/heads/staging'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | grep -v 'planit2-staging' | head -n 1)
          echo "Extracted deployment URL: $DEPLOY_URL"
          if [ -n "$DEPLOY_URL" ]; then
            DEPLOY_HOST=$(echo "$DEPLOY_URL" | sed 's|https://||')
            echo "Assigning alias planit2-staging.vercel.app to $DEPLOY_HOST via REST API..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://api.vercel.com/v2/deployments/${DEPLOY_HOST}/aliases?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"alias": "planit2-staging.vercel.app"}')
            echo "API Response: $RESPONSE"
            if ! echo "$RESPONSE" | grep -qE 'HTTP_STATUS:20[0-9]'; then
              echo "REST API alias failed, attempting CLI fallback..."
              vercel alias set "$DEPLOY_URL" planit2-staging.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
            fi
          else
            echo "Failed to extract deployment URL"
            exit 1
          fi
