name: Deploy em Vercel 

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJ_ID }}

permissions:
  contents: read

# Never cancel a deployment: migrations may already be applying.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  verify-migrations:
    name: Verify migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Rebuild the database from migrations and run SQL tests
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase db reset --no-seed
          supabase test db

      - name: Stop the disposable database
        if: always()
        run: supabase stop --no-backup

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build


  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs:
      - build
      - verify-migrations
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      # Staging migrations (staging branch)
      - name: Run Migrations (Staging)
        if: github.ref == 'refs/heads/staging'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          args=(--include-all)
          if [ -n "${{ secrets.SUPABASE_DB_URL_STAGING }}" ]; then
            args+=(--db-url "${{ secrets.SUPABASE_DB_URL_STAGING }}")
          elif [ -n "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}" ]; then
            args+=(--remote="${{ secrets.SUPABASE_STAGING_PROJECT_ID }}" --password="${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}")
          else
            args+=(--remote="${{ secrets.SUPABASE_STAGING_PROJECT_ID }}")
          fi
          supabase db push --dry-run "${args[@]}"
          supabase db push --yes "${args[@]}"

      # The production database recorded migration 20261106150000, which was
      # applied out-of-band and never committed to this repository. Because the
      # remote history is ahead of the local migrations, `supabase db push`
      # aborts before applying anything. Mark that version as reverted in the
      # remote history so deployments can continue. This only touches the
      # history table and is safe to repeat.
      - name: Repair Production Migration History
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.SUPABASE_DB_URL_PRODUCTION }}" ]; then
            repair_args=(--db-url "${{ secrets.SUPABASE_DB_URL_PRODUCTION }}")
          else
            repair_args=(--remote="${{ secrets.SUPABASE_PROD_PROJECT_ID }}")
          fi
          supabase migration repair --status reverted --yes 20261106150000 "${repair_args[@]}"

      # Production migrations (main branch)
      - name: Run Migrations (Production)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          args=(--include-all)
          if [ -n "${{ secrets.SUPABASE_DB_URL_PRODUCTION }}" ]; then
            args+=(--db-url "${{ secrets.SUPABASE_DB_URL_PRODUCTION }}")
          elif [ -n "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" ]; then
            args+=(--remote="${{ secrets.SUPABASE_PROD_PROJECT_ID }}" --password="${{ secrets.SUPABASE_PROD_DB_PASSWORD }}")
          else
            args+=(--remote="${{ secrets.SUPABASE_PROD_PROJECT_ID }}")
          fi
          supabase db push --dry-run "${args[@]}"
          supabase db push --yes "${args[@]}"


  deploy: 
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Destroy repo reference 
        run: rm -rf .git 

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel

      # Production deployment (main branch)
      - name: Pull Vercel environment (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Staging deployment (staging branch)
      - name: Pull Vercel environment (Staging)
        if: github.ref == 'refs/heads/staging'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Configure Staging Database Environment
        if: github.ref == 'refs/heads/staging'
        run: |
          if [ -n "${{ secrets.SUPABASE_STAGING_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_STAGING_URL }}" >> .vercel/.env.preview.local
          fi
          if [ -n "${{ secrets.SUPABASE_STAGING_ANON_KEY }}" ]; then
            echo "SUPABASE_KEY=${{ secrets.SUPABASE_STAGING_ANON_KEY }}" >> .vercel/.env.preview.local
          fi

      - name: Build (Staging)
        if: github.ref == 'refs/heads/staging'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | grep -v 'planit2-staging' | head -n 1)
          echo "Extracted deployment URL: $DEPLOY_URL"
          if [ -n "$DEPLOY_URL" ]; then
            DEPLOY_HOST=$(echo "$DEPLOY_URL" | sed 's|https://||')
            echo "Assigning alias planit2-staging.vercel.app to $DEPLOY_HOST via REST API..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://api.vercel.com/v2/deployments/${DEPLOY_HOST}/aliases?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"alias": "planit2-staging.vercel.app"}')
            echo "API Response: $RESPONSE"
            if ! echo "$RESPONSE" | grep -qE 'HTTP_STATUS:20[0-9]'; then
              echo "REST API alias failed, attempting CLI fallback..."
              vercel alias set "$DEPLOY_URL" planit2-staging.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
            fi
          else
            echo "Failed to extract deployment URL"
            exit 1
          fi
