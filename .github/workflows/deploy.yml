name: Deploy em Vercel 

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJ_ID }}

jobs:

  test: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 
      #- run: npm i -D @types/node@^24v
      - run: npm i -D vitest @vitejs/plugin-react jsdom @testing-library/react @testing-library/jest-dom
      - run: npm test 


  deploy:
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Destroy repo reference 
        run: rm -rf .git 

      - uses: actions/setup-node@v4
        with:
          node-version: 24


      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
