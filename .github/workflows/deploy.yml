name: Deploy em Vercel 

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJ_ID }}

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build


  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Staging migrations (staging branch)
      - name: Run Migrations (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_URL_STAGING }}" ]; then
            supabase db push --yes --db-url "${{ secrets.SUPABASE_DB_URL_STAGING }}"
          elif [ -n "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}" ]; then
            supabase db push --yes --remote="${{ secrets.SUPABASE_STAGING_PROJECT_ID }}" --password="${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}"
          else
            supabase db push --yes --remote="${{ secrets.SUPABASE_STAGING_PROJECT_ID }}"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Production migrations (main branch)
      - name: Run Migrations (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_URL_PRODUCTION }}" ]; then
            supabase db push --yes --db-url "${{ secrets.SUPABASE_DB_URL_PRODUCTION }}"
          elif [ -n "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" ]; then
            supabase db push --yes --remote="${{ secrets.SUPABASE_PROD_PROJECT_ID }}" --password="${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
          else
            supabase db push --yes --remote="${{ secrets.SUPABASE_PROD_PROJECT_ID }}"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}


  deploy: 
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Destroy repo reference 
        run: rm -rf .git 

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm i -g vercel

      # Production deployment (main branch)
      - name: Pull Vercel environment (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Staging deployment (staging branch)
      - name: Pull Vercel environment (Staging)
        if: github.ref == 'refs/heads/staging'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Configure Staging Database Environment
        if: github.ref == 'refs/heads/staging'
        run: |
          if [ -n "${{ secrets.SUPABASE_STAGING_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_STAGING_URL }}" >> .vercel/.env.preview.local
          fi
          if [ -n "${{ secrets.SUPABASE_STAGING_ANON_KEY }}" ]; then
            echo "SUPABASE_KEY=${{ secrets.SUPABASE_STAGING_ANON_KEY }}" >> .vercel/.env.preview.local
          fi

      - name: Build (Staging)
        if: github.ref == 'refs/heads/staging'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)
          echo "Deployed staging to: $DEPLOY_URL"
          vercel alias set "$DEPLOY_URL" planit2-staging.vercel.app --token=${{ secrets.VERCEL_TOKEN }} || true
