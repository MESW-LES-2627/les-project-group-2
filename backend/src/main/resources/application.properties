spring.application.name=travel_planner

server.port=${SERVER_PORT:8080}
 
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travel_planner}
spring.datasource.username=${DB_USER:travel_planner}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

# set to update the db accordingly to the code when run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false